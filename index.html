<!DOCTYPE html>
<html>
<head>
    <title>BTechian Project Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #projectList {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .project-card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            padding: 15px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .project-card img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .project-card h3 { margin: 10px 0 5px 0; color: #333; }
        .project-card p { margin: 0 0 10px 0; color: #555; }
        .project-card button { background-color: #ff4d4d; }
        .project-card button:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <h2>BTechian Project Hub</h2>

    <div class="form-container">
        <input type="text" id="projectName" placeholder="Project Name">
        <textarea id="projectDesc" placeholder="Project Description"></textarea>
        <input type="text" id="projectImage" placeholder="Paste Image URL">
        <button onclick="addProject()">Add Project</button>
    </div>

    <div id="projectList"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
