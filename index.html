<!DOCTYPE html>
<html>
<head>
    <title>BTechian Project Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }
        .form-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        button {
            padding: 12px 25px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background-color: #0056b3; transform: scale(1.05); }
        #projectList {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .project-card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            padding: 15px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .project-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.35);}
        .project-card img { width: 100%; border-radius: 15px; margin-bottom: 10px; }
        .project-card button { background-color: #ff4d4d; margin-top: 8px; }
        .project-card button:hover { background-color: #cc0000; }
        @media (max-width: 600px) {
            #projectList { flex-direction: column; align-items: center; }
        }
        /* Modal for project details */
        .modal {
            display: none;
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .close-btn {
            background: #ff4d4d;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        .close-btn:hover { background: #cc0000; }
    </style>
</head>
<body>
<h2>BTechian Project Hub</h2>

<div class="form-container">
    <input type="text" id="projectName" placeholder="Project Name">
    <textarea id="projectDesc" placeholder="Project Description"></textarea>
    <input type="file" id="projectImageFile">
    <button onclick="addProject()">Add Project</button>
</div>

<div id="projectList"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3 id="modalName"></h3>
        <img id="modalImage" width="100%" />
        <p id="modalDesc"></p>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
